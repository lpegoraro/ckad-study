apiVersion: v1
kind: Pod
metadata:
  name: log-processor
  labels:
    app: log-processor
spec:
  restartPolicy: OnFailure
  containers:
    - name: writer
      image: busybox:1.35
      command: ["sh", "-c", "touch /var/log/app.log && while sleep 5; do date >> /var/log/app.log; done"]
      volumeMounts:
        - name: log-volume
          mountPath: /var/log
    - name: reader
      image: busybox:1.35
      command: ["sh", "-c", "tail -f /var/log/app.log"]
      volumeMounts:
        - name: log-volume
          mountPath: /var/log
  volumes:
    - name: log-volume
      emptyDir: {}