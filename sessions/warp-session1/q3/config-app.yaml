apiVersion: v1
kind: Pod
metadata:
  name: config-app
spec:
  containers:
    - name: config-app
      image: nginx:latest
      env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
      volumeMounts:
        - name: app-config-volume
          mountPath: /config
          readOnly: true
  volumes:
    - name: app-config-volume
      configMap:
        name: app-config
        items:
        - key: app.properties
          path: app.properties
