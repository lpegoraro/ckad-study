apiVersion: v1
kind: Pod
metadata:
  name: resource-pod
  labels:
    run: resource-pod
spec:
  restartPolicy: OnFailure
  containers:
    - name: resource-pod
      image: nginx:1.21
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi