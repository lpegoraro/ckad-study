apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
    tier: api
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      tier: api
  strategy: {}
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
      - image: nginx:alpine
        name: nginx
        resources: {}
        ports:
          - name: nginx
            containerPort: 80
