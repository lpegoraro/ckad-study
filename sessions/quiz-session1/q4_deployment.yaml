apiVersion: apps/v1
kind: Deployment
metadata:
  name: q4-deploy
  namespace: q4
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-app
  template:
    metadata:
      labels:
        app: data-app
    spec:
      containers:
        - name: data-reader
          image: datareader
          volumeMounts:
            - name: my-pvc
              persistentVolumeClaim:
                claimName: my-pvc

