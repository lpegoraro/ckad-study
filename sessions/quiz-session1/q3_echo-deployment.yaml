apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: echo-deploy
  name: echo-deploy
  namespace: q3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-deploy
  template:
    metadata:
      labels:
        app: echo-deploy
    spec:
      containers:
      - image: hashicorp/http-echo:0.2.3
        name: http-echo
        ports:
          - containerPort: 5678
        args: ["-text", "hello"]

