apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: nginx-deploy
  namespace: quiz1-q1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - image: nginx:1.21
        name: nginx
        ports:
          - containerPort: 80
        env:
          - name: ENV
            value: "production"
        resources: 
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

